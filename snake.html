<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
      touch-action: none;
      user-select: none;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #4ecca3;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 14px;
      font-size: 1rem;
      letter-spacing: 2px;
    }

    #scoreboard span {
      color: #a0a0b0;
    }

    #scoreboard strong {
      color: #4ecca3;
    }

    #canvas-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #4ecca3;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(78, 204, 163, 0.3);
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      gap: 12px;
    }

    #overlay h2 {
      font-size: 1.8rem;
      color: #4ecca3;
      letter-spacing: 3px;
    }

    #overlay p {
      color: #a0a0b0;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    #overlay .score-display {
      font-size: 1.1rem;
      color: #fff;
    }

    #start-btn {
      margin-top: 8px;
      padding: 12px 36px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      transition: background 0.2s;
    }

    #start-btn:hover {
      background: #38b48e;
    }

    /* Touch D-pad */
    #dpad {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      grid-template-columns: 60px 60px 60px;
      grid-template-rows: 60px 60px 60px;
      gap: 4px;
      margin-top: 20px;
    }

    .dpad-btn {
      background: rgba(78, 204, 163, 0.15);
      border: 2px solid #4ecca3;
      border-radius: 8px;
      color: #4ecca3;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn:active {
      background: rgba(78, 204, 163, 0.45);
    }

    #btn-up    { grid-area: up; }
    #btn-left  { grid-area: left; }
    #btn-right { grid-area: right; }
    #btn-down  { grid-area: down; }

    #hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<h1>Snake</h1>

<div id="scoreboard">
  <div><span>SCORE </span><strong id="score-val">0</strong></div>
  <div><span>BEST &nbsp;</span><strong id="best-val">0</strong></div>
</div>

<div id="canvas-wrapper">
  <canvas id="game"></canvas>

  <div id="overlay">
    <h2 id="overlay-title">SNAKE</h2>
    <p id="overlay-sub">Eat the food. Don't hit yourself.</p>
    <div id="overlay-score" class="score-display" style="display:none"></div>
    <button id="start-btn">START</button>
  </div>
</div>

<div id="dpad">
  <button class="dpad-btn" id="btn-up">▲</button>
  <button class="dpad-btn" id="btn-left">◀</button>
  <button class="dpad-btn" id="btn-right">▶</button>
  <button class="dpad-btn" id="btn-down">▼</button>
</div>

<div id="hint">swipe anywhere or use arrow keys</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const COLS = 20, ROWS = 20, CELL = 20;
  const SPEEDS = [150, 130, 110, 90, 75]; // ms per tick, gets faster every 5 pts

  // ── Canvas setup ─────────────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  canvas.width  = COLS * CELL;
  canvas.height = ROWS * CELL;
  const ctx = canvas.getContext('2d');

  // ── State ─────────────────────────────────────────────────────────────────
  let snake, dir, nextDir, food, score, best, running, loopId;
  best = parseInt(localStorage.getItem('snakeBest') || '0');
  document.getElementById('best-val').textContent = best;

  // ── Helpers ───────────────────────────────────────────────────────────────
  function rand(n) { return Math.floor(Math.random() * n); }

  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let f;
    do { f = { x: rand(COLS), y: rand(ROWS) }; }
    while (occupied.has(`${f.x},${f.y}`));
    return f;
  }

  function speedForScore(s) {
    const idx = Math.min(Math.floor(s / 5), SPEEDS.length - 1);
    return SPEEDS[idx];
  }

  // ── Draw ──────────────────────────────────────────────────────────────────
  function draw() {
    // Background grid
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#16213e' : '#17223f';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    // Food — glowing dot
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    const grad = ctx.createRadialGradient(fx, fy, 1, fx, fy, CELL * 0.5);
    grad.addColorStop(0, '#ff6b6b');
    grad.addColorStop(1, '#c0392b');
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.38, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Snake
    snake.forEach((seg, i) => {
      const t = i / (snake.length - 1 || 1);
      // Head is bright teal, tail fades to darker green
      const r = Math.round(78  * (1 - t) + 30  * t);
      const g = Math.round(204 * (1 - t) + 130 * t);
      const b = Math.round(163 * (1 - t) + 60  * t);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 1 : 2;
      ctx.beginPath();
      ctx.roundRect(
        seg.x * CELL + pad, seg.y * CELL + pad,
        CELL - pad * 2, CELL - pad * 2,
        i === 0 ? 4 : 3
      );
      ctx.fill();
    });

    // Eyes on head
    const head = snake[0];
    const ex = head.x * CELL, ey = head.y * CELL;
    ctx.fillStyle = '#1a1a2e';
    if (dir.x === 1)       { eye(ex+14, ey+5);  eye(ex+14, ey+13); }
    else if (dir.x === -1) { eye(ex+4,  ey+5);  eye(ex+4,  ey+13); }
    else if (dir.y === -1) { eye(ex+5,  ey+4);  eye(ex+13, ey+4);  }
    else                   { eye(ex+5,  ey+14); eye(ex+13, ey+14); }
  }

  function eye(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── Game loop ─────────────────────────────────────────────────────────────
  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      document.getElementById('score-val').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('snakeBest', best);
        document.getElementById('best-val').textContent = best;
      }
      food = spawnFood();
      // Restart loop at new speed
      clearTimeout(loopId);
      loopId = setTimeout(scheduleLoop, speedForScore(score));
    } else {
      snake.pop();
    }

    draw();
  }

  function scheduleLoop() {
    if (!running) return;
    tick();
    if (running) loopId = setTimeout(scheduleLoop, speedForScore(score));
  }

  // ── Start / Game Over ─────────────────────────────────────────────────────
  function startGame() {
    snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    document.getElementById('score-val').textContent = 0;
    food    = spawnFood();
    running = true;
    document.getElementById('overlay').style.display = 'none';
    clearTimeout(loopId);
    loopId = setTimeout(scheduleLoop, speedForScore(0));
    draw();
  }

  function gameOver() {
    running = false;
    clearTimeout(loopId);
    draw();
    const overlay = document.getElementById('overlay');
    document.getElementById('overlay-title').textContent = 'GAME OVER';
    document.getElementById('overlay-sub').textContent   = '';
    const sd = document.getElementById('overlay-score');
    sd.style.display = 'block';
    sd.textContent = `Score: ${score}  |  Best: ${best}`;
    document.getElementById('start-btn').textContent = 'PLAY AGAIN';
    overlay.style.display = 'flex';
  }

  document.getElementById('start-btn').addEventListener('click', startGame);

  // ── Keyboard ──────────────────────────────────────────────────────────────
  const KEY_MAP = {
    ArrowUp:    { x: 0, y: -1 },
    ArrowDown:  { x: 0, y:  1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x:  1, y: 0 },
    w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    s: { x: 0, y:  1 }, S: { x: 0, y:  1 },
    a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    d: { x:  1, y: 0 }, D: { x:  1, y: 0 },
  };

  document.addEventListener('keydown', e => {
    if (!running) return;
    const d = KEY_MAP[e.key];
    if (!d) return;
    e.preventDefault();
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d; // no 180° reversal
  });

  // ── D-pad buttons ─────────────────────────────────────────────────────────
  function dpadPress(d) {
    if (!running) return;
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }

  document.getElementById('btn-up').addEventListener('touchstart',    e => { e.preventDefault(); dpadPress({ x: 0, y: -1 }); }, { passive: false });
  document.getElementById('btn-down').addEventListener('touchstart',  e => { e.preventDefault(); dpadPress({ x: 0, y:  1 }); }, { passive: false });
  document.getElementById('btn-left').addEventListener('touchstart',  e => { e.preventDefault(); dpadPress({ x: -1, y: 0 }); }, { passive: false });
  document.getElementById('btn-right').addEventListener('touchstart', e => { e.preventDefault(); dpadPress({ x:  1, y: 0 }); }, { passive: false });

  // Also support mouse clicks on d-pad
  document.getElementById('btn-up').addEventListener('mousedown',    () => dpadPress({ x: 0, y: -1 }));
  document.getElementById('btn-down').addEventListener('mousedown',  () => dpadPress({ x: 0, y:  1 }));
  document.getElementById('btn-left').addEventListener('mousedown',  () => dpadPress({ x: -1, y: 0 }));
  document.getElementById('btn-right').addEventListener('mousedown', () => dpadPress({ x:  1, y: 0 }));

  // ── Swipe detection ───────────────────────────────────────────────────────
  let touchStartX = 0, touchStartY = 0;

  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!running) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // tap, ignore
    let d;
    if (Math.abs(dx) > Math.abs(dy)) {
      d = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
    } else {
      d = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
    }
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  }, { passive: true });

  // ── Initial draw ──────────────────────────────────────────────────────────
  snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir     = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  food    = { x: 15, y: 10 };
  draw();
</script>
</body>
</html>
